<!doctype html>
<html>
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Kargo - Geçmiş</title>
		<script src="../view/settings-store.js"></script>
		<link rel="stylesheet" href="../static/styles.css" />
	</head>
	<body class="settings-page history-page">
		<header class="top-container">
			<div class="search-header">
				<input id="historyFilter" class="dest" type="search" placeholder="Geçmişte ara" autocomplete="off" />
			</div>
		</header>

		<div class="settings-shell">
			<header class="settings-header history-header">
				<div>
					<h1>Geçmiş</h1>
					<p>Son ziyaret ettiğin sayfalar.</p>
					<p id="historyCount" class="history-count"></p>
				</div>

				<button id="clearHistoryBtn" class="settings-danger-btn" type="button">Tümünü temizle</button>
			</header>

			<main class="settings-content">
				<section class="settings-card history-card">
					<ul id="historyList" class="history-entries"></ul>

					<div id="historyEmpty" class="history-empty" hidden>
						<p id="historyEmptyTitle" class="history-empty-title">Henüz geçmiş yok.</p>
						<p id="historyEmptyText">Ziyaret ettiğin sayfalar burada listelenir.</p>
					</div>
				</section>
			</main>
		</div>

		<div id="historyToast" class="toast" role="status" aria-live="polite"></div>

		<script src="../view/sidebar-markup.js"></script>
		<script src="../utils/url.js"></script>
		<script src="../view/sidebar.js"></script>
		<script src="../view/bookmarks.js"></script>
		<script src="../view/shortcuts.js"></script>
		<script src="../view/history.js"></script>
	</body>
</html>
